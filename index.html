    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fontsの読み込み（見やすいフォント） -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #f8fafc; /* 薄いグレーの背景 */
        }
        /* スムーズなアニメーション用 */
        .card-enter {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>

    </header>

            <!-- JavaScriptでタブが生成されます -->

            <!-- JavaScriptでカードが生成されます -->
        </div>

        <!-- 検索結果がゼロの時のメッセージ -->

            </svg>

            <p class="text-slate-500 mt-1">別のキーワードを試すか、学年のタブを「すべて」にしてみてください。</p>
        </div>
    </main>

                tags: ["クイズ", "タイムアタック", "総復習", "全範囲", "入試", "生物", "化学", "物理", "地学", "ゲーム"],

        // タブの定義
        const tabs = ["すべて", "1年", "2年", "3年", "その他"];

        // ==========================================
        // ここから下はシステムの動作プログラムです（変更不要）
        // ==========================================

        let currentFilter = "すべて";
        let currentSearchQuery = "";

        const appGrid = document.getElementById('appGrid');
        const noResults = document.getElementById('noResults');
        const searchInput = document.getElementById('searchInput');
        const tabContainer = document.getElementById('tabContainer');

        // タブを描画する関数
        function renderTabs() {
            tabContainer.innerHTML = '';
            tabs.forEach(tab => {
                const btn = document.createElement('button');
                btn.textContent = tab;
                
                // タブレットで押しやすいように padding (px-6 py-3) を大きめに設定
                btn.className = `px-6 py-3 rounded-full text-base font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 ${
                    currentFilter === tab 
                        ? 'bg-blue-600 text-white shadow-md' 
                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                }`;
                
                btn.addEventListener('click', () => {
                    currentFilter = tab;
                    renderTabs(); // タブの見た目（アクティブ状態）を更新
                    renderApps(); // アプリ一覧を再描画
                });
                tabContainer.appendChild(btn);
            });
        }

        // アプリ一覧を描画する関数
        function renderApps() {
            appGrid.innerHTML = ''; // 一旦クリア
            let visibleCount = 0;

            const query = currentSearchQuery.toLowerCase();

            appData.forEach((app, index) => {
                // 1. 学年フィルターの判定（複数学年にも対応できるように変更）
                const matchGrade = currentFilter === "すべて" || app.grade.includes(currentFilter);
                
                // 2. 検索キーワードの判定（タイトル、説明、タグから検索）
                const searchTargetText = (app.title + " " + app.description + " " + app.tags.join(" ")).toLowerCase();
                const matchSearch = searchTargetText.includes(query);

                // 両方の条件を満たせば表示
                if (matchGrade && matchSearch) {
                    visibleCount++;
                    const card = document.createElement('a');
                    card.href = app.url;
                    
                    // 別タブで開くように設定（プレビューでのエラーを防ぎ、生徒も使いやすくなります）
                    card.target = "_blank"; 
                    // セキュリティ対策（別タブを開く際の推奨設定）
                    card.rel = "noopener noreferrer";

                    // カードのデザイン（タブレットで押しやすい大きなクリック領域）
                    card.className = `block bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hover:shadow-lg hover:border-blue-300 transition-all duration-200 cursor-pointer card-enter group outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2`;
                    // アニメーションを少しずつずらす
                    card.style.animationDelay = `${index * 0.05}s`;

                    card.innerHTML = `
                        <div class="flex items-start gap-4 h-full flex-col">
                            <div class="flex items-center gap-3 w-full">
                                <div class="text-4xl group-hover:scale-110 transition-transform">${app.icon}</div>
                                <div>
                                    <span class="inline-block px-2.5 py-1 rounded-md text-xs font-bold mb-2 ${app.color}">${app.grade}</span>
                                    <h2 class="text-xl font-bold text-slate-800 leading-tight group-hover:text-blue-600 transition-colors">${app.title}</h2>
                                </div>
                            </div>
                            <p class="text-slate-600 text-sm leading-relaxed mt-2 flex-grow">${app.description}</p>
                            
                            <!-- 関連タグの表示（生徒が見て、どういう単語で検索できるか分かるようにする） -->
                            <div class="flex flex-wrap gap-1 mt-3">
                                ${app.tags.slice(0, 3).map(tag => `<span class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded-full border border-slate-100">#${tag}</span>`).join('')}
                                ${app.tags.length > 3 ? `<span class="text-xs text-slate-400">...</span>` : ''}
                            </div>
                        </div>
                    `;
                    appGrid.appendChild(card);
                }
            });

            // 検索結果が0件の場合の処理
            if (visibleCount === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        // 検索ボックスの入力イベント（文字を打つたびにリアルタイムで絞り込み）
        searchInput.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            renderApps();
        });

        // ページ読み込み時の初期化
        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderApps();
        });

    </script>
</body>
</html>
