            if (isTeacherUnlocked) {
                currentFilter = "先生用";

                passwordInput.value = '';

        }

        submitPasswordBtn.addEventListener('click', checkPassword);

        function renderTabs() {
            tabContainer.innerHTML = '';
            tabs.forEach(tab => {
                const btn = document.createElement('button');
                btn.textContent = tab;
                
                // タブレットで押しやすいように padding (px-6 py-3) を大きめに設定
                btn.className = `px-6 py-3 rounded-full text-base font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 ${

                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'
                }`;
                
                btn.addEventListener('click', () => {
                    if (tab === "先生用") {
                        openTeacherTab();
                    } else {
                        currentFilter = tab;
                        renderTabs(); // タブの見た目（アクティブ状態）を更新
                        renderApps(); // アプリ一覧を再描画
                    }
                });
                tabContainer.appendChild(btn);
            });
        }

        // アプリ一覧を描画する関数
        function renderApps() {
            appGrid.innerHTML = ''; // 一旦クリア
            let visibleCount = 0;

            const query = currentSearchQuery.toLowerCase();

            appData.forEach((app, index) => {
                // 1. 学年フィルターの判定（「すべて」の時は「先生用」を非表示にする）
                let matchGrade = false;
                if (currentFilter === "すべて") {
                    matchGrade = !app.grade.includes("先生用");
                } else {
                    matchGrade = app.grade.includes(currentFilter);
                }
                
                // 2. 検索キーワードの判定（タイトル、説明、タグから検索）
                const searchTargetText = (app.title + " " + app.description + " " + app.tags.join(" ")).toLowerCase();
                const matchSearch = searchTargetText.includes(query);

                // 両方の条件を満たせば表示
                if (matchGrade && matchSearch) {
                    visibleCount++;
                    const card = document.createElement('a');
                    card.href = app.url;
                    
                    // 別タブで開くように設定（プレビューでのエラーを防ぎ、生徒も使いやすくなります）

                    // セキュリティ対策（別タブを開く際の推奨設定）

                    card.className = `block bg-white rounded-2xl shadow-sm border border-slate-200 p-6 hover:shadow-lg hover:border-blue-300 transition-all duration-200 cursor-pointer card-enter group outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2`;
